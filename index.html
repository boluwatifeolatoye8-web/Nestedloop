<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Nested loop</title>
</head>
<body>
      <button onclick="checkout()">x</button>

    <script>
        for( let i= 1 ;i<= 5;i++){
            for(let b =1; b<=30 ; b++){
                // console.log(i,j);
                console.log(`${i} x ${b} = ${i*b}`);
                
            }
        }
      function checkout(){
        window.close();
      }
    </script>
</body>
</html>
